seed: 42

paths:
  data: ./data
  checkpoints: ./checkpoints
  artifacts: ./artifacts
  results: ./results

mnist:
  forget_fraction: 0.10
  num_classes: 10

training:
  epochs: 10
  batch_size: 128
  learning_rate: 0.01
  weight_decay: 0.0005
  momentum: 0.9
  num_workers: 0

unlearning:
  epochs: 5
  batch_size: 128
  learning_rate: 0.0005
  temperature: 4.0
  kd_weight: 0.5
  forget_weight: 0.20
  gradient_threshold: 0.25
  max_grad_norm: 1.0
