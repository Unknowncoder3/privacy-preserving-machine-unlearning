seed: 42

paths:
  data: ./data
  checkpoints: ./checkpoints
  artifacts: ./artifacts
  results: ./results

cifar10:
  forget_fraction: 0.10
  num_classes: 10

training:
  epochs: 20
  batch_size: 128
  learning_rate: 0.1
  weight_decay: 0.0005
  momentum: 0.9
  num_workers: 2

unlearning:
  epochs: 5
  batch_size: 128
  learning_rate: 0.001
  temperature: 4.0
  kd_weight: 1.0
  forget_weight: 1.0
  gradient_threshold: 0.5
